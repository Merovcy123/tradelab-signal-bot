name: Signal-Waechter

on:
  schedule:
    - cron: "37 * * * *"        # jede Stunde (UTC): Kauf/Stop/Ziel/48h prüfen
    - cron: "3,18,33 5,6 * * *"  # Morgen: Tagesplan ab 07:00 Uhr CH (Winter 06:xx UTC, Sommer 05:xx UTC)
  workflow_dispatch:       # manuell starten (Button "Run workflow")

permissions:
  contents: write

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Märkte prüfen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_waechter.py --einmal
      - name: Zustand speichern
        run: |
          git config user.name "signal-waechter"
          git config user.email "actions@github.com"
          for f in zustand.json signale_log.txt journal.csv journal_v2.csv zustand_v2_backup.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Zustand aktualisiert" && git push)
