name: Auto-Bot (P4 Demo)

on:
  schedule:
    - cron: "7,37 * * * *"   # Reserve: GitHub-Zeitplan (oft verspätet)
  # Hauptzeitgeber: cron-job.org startet diesen Workflow alle 10 Minuten
  workflow_dispatch:
    inputs:
      test_order:
        description: "Nur Alpaca-Test-Order (Kauf weit unter Markt setzen + löschen)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-bot
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bot-Durchlauf
        env:
          BROKER: alpaca
          TRADELAB_DATEN: auto_bot/daten
          TRADELAB_P4_DATEN: auto_bot/daten_p4
          TRADELAB_DEMO_DATEN: auto_bot/daten_demo
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p auto_bot/daten
          if [ "${{ inputs.test_order }}" = "true" ]; then
            python auto_bot/bot.py --test-order
          else
            # P4 Demo: Longs bei Alpaca Paper, Shorts als Simulation, alle 5 zusätzlich als Vergleichs-Simulation
            python auto_bot/p4_demo.py
          fi
      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "tradelab-auto-bot"
          git config user.email "actions@github.com"
          for d in auto_bot/daten auto_bot/daten_p4 auto_bot/daten_demo; do [ -d "$d" ] && git add -A "$d"; done
          git diff --cached --quiet && exit 0
          git commit -m "P4-Bot Zustand"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
