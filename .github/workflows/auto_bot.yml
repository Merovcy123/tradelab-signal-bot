name: Auto-Bot (P4 Demo)

on:
  schedule:
    - cron: "7,37 * * * *"   # Reserve: GitHub-Zeitplan (oft verspätet)
  # Hauptzeitgeber: cron-job.org startet diesen Workflow alle 10 Minuten
  workflow_dispatch:
    inputs:
      test_order:
        description: "Nur Alpaca-Test-Order (Kauf weit unter Markt setzen + löschen)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-bot
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Genug Historie, damit der Zustands-Push ein Rennen zweier Läufe erkennen kann
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Wartet ein Lauf lange auf einen freien Runner, sind seine Kurse und sein
      # Zustand veraltet. Dann lieber überspringen als mit alten Daten handeln.
      - name: Aktualität prüfen
        id: alter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # github.run_started_at ist im Kontext leer – Startzeit über die API holen.
          start_iso=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"                         --jq '.run_started_at' 2>/dev/null || true)
          start=$(date -u -d "$start_iso" +%s 2>/dev/null || true)
          if [ -z "$start_iso" ] || [ -z "$start" ]; then
            echo "Startzeit nicht ermittelbar – Lauf wird normal ausgeführt."
            echo "frisch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          alter=$(( $(date -u +%s) - start ))
          echo "Lauf wurde vor ${alter}s ausgelöst (${start_iso})."
          if [ "$alter" -gt 300 ]; then
            echo "Älter als 5 Minuten (Runner-Warteschlange) – Durchlauf wird übersprungen."
            echo "frisch=false" >> "$GITHUB_OUTPUT"
          else
            echo "frisch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bot-Durchlauf
        if: steps.alter.outputs.frisch == 'true'
        env:
          BROKER: alpaca
          TRADELAB_DATEN: auto_bot/daten
          TRADELAB_P4_DATEN: auto_bot/daten_p4
          TRADELAB_DEMO_DATEN: auto_bot/daten_demo
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p auto_bot/daten
          if [ "${{ inputs.test_order }}" = "true" ]; then
            python auto_bot/bot.py --test-order
          else
            # P4 Demo: Longs bei Alpaca Paper, Shorts als Simulation, alle 5 zusätzlich als Vergleichs-Simulation
            python auto_bot/p4_demo.py
          fi

      - name: Zustand speichern
        if: always() && steps.alter.outputs.frisch == 'true'
        run: |
          ZD="auto_bot/daten auto_bot/daten_p4 auto_bot/daten_demo"
          git config user.name "tradelab-auto-bot"
          git config user.email "actions@github.com"
          for d in $ZD; do [ -d "$d" ] && git add -A "$d"; done
          if git diff --cached --quiet; then
            echo "Kein geänderter Zustand – nichts zu speichern."
            exit 0
          fi
          git commit -q -m "P4-Bot Zustand"

          for i in 1 2 3 4 5; do
            git fetch -q origin main
            fern=$(git rev-parse origin/main)

            if [ "$fern" = "$GITHUB_SHA" ]; then
              # Niemand war schneller: direkt pushen
              if git push -q origin HEAD:main; then exit 0; fi

            elif git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null \
                 && git diff --quiet "$GITHUB_SHA" "$fern" -- $ZD; then
              # Fremder Commit, aber ohne Zustandsdateien: sauber daraufsetzen
              if git rebase -q "$fern"; then
                if git push -q origin HEAD:main; then exit 0; fi
              else
                git rebase --abort >/dev/null 2>&1 || true
              fi

            else
              # Ein neuerer Lauf hat den Zustand schon fortgeschrieben.
              # Unser Zustand ist damit veraltet und wird verworfen (kein Fehler).
              echo "Neuerer Lauf hat den Zustand bereits geschrieben – eigener, älterer Zustand wird verworfen."
              exit 0
            fi

            sleep $(( 5 * i ))
          done

          echo "::error::Zustand konnte nach 5 Versuchen nicht gepusht werden."
          exit 1
